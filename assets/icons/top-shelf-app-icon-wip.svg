        <path d="M512 85 L512 445 L407.4 301.0 Z" fill="#FFF4B2" opacity=".30" />
        <path d="M512 85 L616.6 301.0 L512 445 Z" fill="#EAA51B" opacity=".18" />

        <!-- upper left -->
        <path d="M169.6 333.8 L407.4 301.0 L512 445 Z" fill="#FFF0A2" opacity=".20" />
