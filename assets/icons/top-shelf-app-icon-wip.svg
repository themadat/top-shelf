<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
    <title id="title">Top Shelf app icon</title>
    <desc id="desc">A faceted gold star touching a floating wooden shelf, containing icons for books, movies,
        television, podcasts, and music.</desc>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#17457E" />
            <stop offset="100%" stop-color="#071A38" />
        </linearGradient>

        <linearGradient id="starBase" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFE878" />
            <stop offset="100%" stop-color="#FFC23B" />
        </linearGradient>

        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E3A157" />
            <stop offset="100%" stop-color="#A95B27" />
        </linearGradient>

        <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
            <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity=".24" />
        </filter>

        <clipPath id="starClip">
            <polygon
                points="512.0,85.0 616.6,301.0 854.4,333.8 681.3,500.0 723.6,736.2 512.0,623.0 300.4,736.2 342.7,500.0 169.6,333.8 407.4,301.0" />
        </clipPath>
    </defs>

    <!-- Edge-to-edge background -->
    <rect width="1024" height="1024" fill="url(#bg)" />

    <!-- Star base -->
    <polygon
        points="512.0,85.0 616.6,301.0 854.4,333.8 681.3,500.0 723.6,736.2 512.0,623.0 300.4,736.2 342.7,500.0 169.6,333.8 407.4,301.0"
        fill="url(#starBase)" filter="url(#shadow)" />

